<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>GAMEFORGE Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230F1A26'/%3E%3Cpath d='M16 5 26 11v10l-10 6-10-6V11z' fill='none' stroke='%233CCFC4' stroke-width='2.2'/%3E%3Cpath d='M16 11v10M11 14l5 3 5-3' fill='none' stroke='%233CCFC4' stroke-width='2.2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/styles.css">
<script>try{var t=localStorage.getItem("gf.theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<a class="skip" href="#view">Zum Inhalt springen</a>
<div class="app">
  <aside class="sidebar" aria-label="Hauptnavigation">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linejoin="round"><path d="M12 2.5 20.5 7.5v9L12 21.5 3.5 16.5v-9z"/><path d="M12 8v8M8.2 10.3 12 12.5l3.8-2.2"/></svg></div>
      <div><b>GAMEFORGE</b><small>STUDIO · 2.0</small></div>
    </div>
    <p class="nav-label">Bereiche</p>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div>
        <p class="nav-label" style="padding:0 4px">Ansicht</p>
        <div class="mode-switch" role="group" aria-label="Bedienmodus">
          <button type="button" data-mode="simple" aria-pressed="true">Einfach</button>
          <button type="button" data-mode="pro" aria-pressed="false">Profi</button>
        </div>
      </div>
      <p class="side-meta" id="mode-hint">Einfach-Modus: Technische Details sind ausgeblendet. Es geht nichts verloren.</p>
      <button type="button" class="theme-btn" id="theme-toggle"></button>
      <p class="side-meta" id="side-meta">Lokal auf diesem PC · Daten bleiben hier.</p>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="crumb" id="crumb"></div>
      <div class="context" id="context" role="group" aria-label="Aktuelles Projekt">
        <label for="ctx-game">Projekt</label>
        <select id="ctx-game" class="ctx-select"></select>
        <select id="ctx-dlc" class="ctx-select" aria-label="Basisspiel oder DLC"></select>
      </div>
      <button type="button" class="sys-pill" id="sys-pill" title="Systemprüfung öffnen"><span class="dot"></span> System wird geprüft …</button>
    </header>
    <main class="workspace" id="view" tabindex="-1"></main>
  </div>
</div>

<button type="button" class="chat-fab" id="chat-fab" aria-controls="chat" aria-expanded="false">
  <svg class="ico" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-5.1A8 8 0 1 1 21 12z"/></svg><span>Mit GAMEFORGE sprechen</span>
</button>
<aside class="chat" id="chat" aria-label="Chat mit GAMEFORGE" aria-hidden="true"></aside>

<div id="dialog" class="modal-wrap" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
    <div class="modal-head"><h2 id="dialog-title"></h2><button type="button" class="icon-btn" id="close-dialog" aria-label="Schließen"><svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="modal-body" id="dialog-body"></div>
    <div class="modal-foot" id="dialog-foot"></div>
  </div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script src="/app.js"></script>
<script src="/refstudio.js"></script>
</body>
</html>
